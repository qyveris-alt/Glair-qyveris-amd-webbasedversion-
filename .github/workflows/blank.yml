name: "Export Game to Web"
on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web Job
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # Maakt handmatig de ontbrekende web-instellingen aan
      - name: Force Create Export Presets File
        run: |
          mkdir -p build/web
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Web"
          platform="HTML5"
          runnable=true
          custom_features=""
          query_options=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"

          [preset.0.options]
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/custom_html_shell=""
          html/head_include=""
          custom_template/release=""
          custom_template/debug=""
          EOF

      # De officiële Godot-omgeving waar alles al in zit (geen downloads nodig!)
      - name: Export Godot Project to Web
        uses: barichello/godot-ci@v3.5.3
        with:
          relative_project_path: ./
          export_preset_name: Web
          export_path: build/web/index.html

      # Publiceer de gemaakte webversie naar GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
