name: "Export Game to Web"
on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web Job
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # Installeert de benodigde zip-software op de Linux-server
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      # Downloadt de officiële Godot 3.5.3 editor en export-templates direct
      - name: Download Godot Engine
        run: |
          wget https://tuxfamily.org
          wget https://tuxfamily.org
          unzip Godot_v3.5.3-stable_linux_headless.64.zip
          mv Godot_v3.5.3-stable_linux_headless.64 godot
          chmod +x godot
          
          # Richt de exportmappen in voor de templates
          mkdir -p ~/.local/share/godot/export_templates/3.5.3.stable
          unzip Godot_v3.5.3-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates/* ~/.local/share/godot/export_templates/3.5.3.stable/

      # Maakt handmatig de ontbrekende web-instellingen aan
      - name: Force Create Export Presets File
        run: |
          mkdir -p build/web
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Web"
          platform="HTML5"
          runnable=true
          custom_features=""
          query_options=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"

          [preset.0.options]
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/custom_html_shell=""
          html/head_include=""
          custom_template/release=""
          custom_template/debug=""
          EOF

      # Compileert de game direct via de handmatig geïnstalleerde engine
      - name: Execute Godot Compilation
        run: |
          ./godot --export "Web" build/web/index.html

      # Publiceer de gemaakte webversie naar GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
