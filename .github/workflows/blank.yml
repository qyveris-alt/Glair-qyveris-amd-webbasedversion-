name: "Export Game to Web"
on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web Job
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      # Maakt handmatig de ontbrekende web-instellingen aan
      - name: Force Create Export Presets File
        run: |
          mkdir -p build/web
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Web"
          platform="HTML5"
          runnable=true
          custom_features=""
          query_options=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"

          [preset.0.options]
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/custom_html_shell=""
          html/head_include=""
          custom_template/release=""
          custom_template/debug=""
          EOF

      # Een veel stabielere compiler-actie die geen 7z-fouten geeft
      - name: Export Godot Project to Web
        uses: ammarahm-ed/godot-export@v1
        with:
          godot-version: '3.5.3' # De stabiele versie voor dit specifieke project
          export-preset: 'Web'
          project-path: './'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
